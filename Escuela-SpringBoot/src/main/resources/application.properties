spring.application.name=Escuela
server.address=${API_BIND:127.0.0.1}
server.port=${API_PORT:9080}
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/ESCUELA?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:escuela_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never
springdoc.swagger-ui.path=/swagger-ui.html
